app:
  id: '7711994394445971492'
  name: 桌角文明
  slogan: 俯身一看，万物正在生活。
  description: '# 桌角文明

    像《God: Serengeti》中的上帝一样，俯瞰眼前的微缩世界。


    《桌角文明》是一款微缩生态沙盘。河流穿过草地，村民采集、搬运、耕作、修屋，累了便走进棚下坐一会儿。远处的猛犸结伴觅食，小象偶尔离群，剑齿虎伺机而动。俯身靠近，你会发现每个小生命都有正在忙的事。


    ## 核心体验

    - **真实微缩生态**：河流穿过草地，村民日常采集、搬运、耕作、修屋，累了便在棚下休憩；远处猛犸结伴觅食，小象偶尔离群，剑齿虎伺机而动，每个小生命都有自己的忙碌节奏。

    - **造物主式交互**：你的每一次轻轻操作，都会在这个世界里引出新的故事。

    - **自由沉浸模式**：可以展开村落见闻画卷，查看刚刚发生的一切；也可以什么都不做，静静陪伴这个小世界生活一会儿。


    ## 交互玩法

    - **降雨滋养**：召唤一场雨，既能滋润草地，也能浇灭熊熊火焰。

    - **点火驱离**：点燃一簇火，观察村民和野兽纷纷躲避危险的真实反应。

    - **投放资源**：放下一束木材，村民会主动搬回村落，修复被损毁的家园。


    俯身靠近，你会发现每个小生命都有正在忙的事。


    敲鼓召集附近有空的村民，点一位村民翻开他的小记。捏住地面划过一段距离撒种，村边果实能采收，远岸嫩草会引来象群。'
  tags:
